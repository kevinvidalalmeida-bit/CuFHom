[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cufhom"
version = "0.1.0"
description = "Periodic fiber geometry and linear/nonlinear FFT homogenization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "numba>=0.60"]

[project.optional-dependencies]
test = ["pytest>=9", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
cufhom-generate = "cufhom.cli.geometry:main"
cufhom-nonlinear = "cufhom.cli.nonlinear:main"

[tool.setuptools]
package-dir = { cufhom = "src", cufhom_core = "core" }
packages = [
    "cufhom",
    "cufhom.cli",
    "cufhom.fft",
    "cufhom.fft.linear",
    "cufhom.fft.nonlinear",
    "cufhom.geometry",
    "cufhom.materials",
    "cufhom_core",
    "cufhom_core.general",
    "cufhom_core.matvecs",
    "cufhom_core.mechanics",
    "cufhom_core.tensors",
]

[tool.setuptools.package-data]
cufhom_core = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
